version: '3'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: RealBuyerz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - bootapp

  realbuyerz:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:admin@postgres:5432/RealBuyerz"
      TOKEN_KEY: BADAMI
      OTP_KEY: OTP-KEY
      TOKEN_EXPIRY: 1d
      TWILIO_ACCOUNT_SID: AC4d0051d9f25af843b4f7fdfc9a18e6e6
      TWILIO_AUTH_TOKEN: fe8365b20b880d82b5989caa72b0debf
      TWILIO_PHONE_NUMBER: 16063571913
      SENDGRID_API_KEY: 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
      FRONTEND_URL: www.realbuyerz.com
    ports:
      - "4000:3000"
    networks:
      - bootapp

networks:
  bootapp:

volumes:
  postgres-data:
  
